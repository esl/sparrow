version: 2.1

executors:
  elixir:
    parameters:
      elixir:
        type: string
      erlang:
        type: string
    docker:
      - image: hexpm/elixir:<< parameters.elixir >>-erlang-<< parameters.erlang >>-alpine-3.24.1
        environment:
            - MIX_ENV=test

jobs:
  test:
    parameters:
      elixir:
        type: string
      erlang:
        type: string
    executor:
      name: elixir
      elixir: << parameters.elixir >>
      erlang: << parameters.erlang >>
    steps:
      - checkout
      - run: apk add --no-cache git openssl
      - run: mix do local.rebar --force, local.hex --force
      - restore_cache:
          key: deps-{{ checksum "mix.lock" }}
      - run: mix do deps.get, deps.compile
      - save_cache:
          key: deps-{{ checksum "mix.lock" }}
          paths:
            - _build
            - deps
      - run: mix compile
      - run: mix format --check-formatted
      - run: mix credo --strict
      - restore_cache:
          key: dialyzer-{{ checksum "mix.lock" }}
      - run:
          name: Create PLTs
          command: |
            mkdir -p .dialyzer
            mix dialyzer --plt
      - save_cache:
          key: dialyzer-{{ checksum "mix.lock" }}
          paths:
            - .dialyzer
      - run: mix dialyzer
      - run:
          name: Run tests
          command: |
            mix sparrow.certs.dev
            mix test

workflows:
  default:
    jobs:
      - test:
          name: elixir-1.19.6-otp-28.5.0.6
          elixir: "1.19.6"
          erlang: "28.5.0.6"
      - test:
          name: elixir-1.20.4-otp-29.0.6
          elixir: "1.20.4"
          erlang: "29.0.6"
